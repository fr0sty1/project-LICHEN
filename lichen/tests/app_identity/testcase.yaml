tests:
  net.lichen.app_identity.ipv6_off:
    tags:
      - lichen
      - app_identity
    platform_allow:
      - native_sim
      - native_sim/native/64
      - qemu_x86
    integration_platforms:
      - native_sim
      - native_sim/native/64
      - qemu_x86
    extra_configs:
      - CONFIG_LICHEN_IPV6=n
  net.lichen.app_identity.ipv6_on:
    tags:
      - lichen
      - app_identity
    platform_allow:
      - native_sim
      - native_sim/native/64
      - qemu_x86
    integration_platforms:
      - native_sim
      - native_sim/native/64
      - qemu_x86
    extra_args:
      - EXTRA_CONF_FILE=ipv6_on.conf
