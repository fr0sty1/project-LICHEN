# Compile/link proof overlay for CONFIG_LICHEN_COAP_DEADDROP (bd
# project-LICHEN-worker6-4xln et al.). No test in-tree enables the deaddrop
# resource, so this pulls in its full dependency chain on top of prj.conf:
#   LICHEN_COAP_DEADDROP depends on LICHEN_COAP_SERVER + LICHEN_OSCORE +
#   LICHEN_DTN (needs LICHEN_ROUTING) and coap_dtn.c uses the SenML encoder
#   (LICHEN_SENML). LICHEN_COAP_CLIENT is deliberately left at prj.conf's
#   default n: coap_client.c has a known pre-existing compile failure
# (bd project-LICHEN-worker6-zhuq verification notes) and is not a Kconfig
# dependency of LICHEN_COAP_DEADDROP. Build with:
#     west build -b qemu_x86 -DEXTRA_CONF_FILE=overlay-deaddrop-proof.conf
CONFIG_LICHEN_ROUTING=y
CONFIG_LICHEN_DTN=y
CONFIG_LICHEN_SENML=y
CONFIG_LICHEN_COAP_DEADDROP=y
# Also compile lichen's coap_server.c (config_put/msg_inbox_post), which no
# in-tree target builds: STANDALONE defaults n everywhere and coap_keys uses
# the modular service. Requires !LICHEN_COAP_CONFIG (not set in prj.conf).
CONFIG_LICHEN_COAP_SERVER_STANDALONE=y
# coap_server.c:449 BUILD_ASSERT: LICHEN_COAP_SERVER_MAX_PAYLOAD (512) + 128
# must fit CONFIG_COAP_SERVER_MESSAGE_SIZE (default 256 is too small here).
CONFIG_COAP_SERVER_MESSAGE_SIZE=768
