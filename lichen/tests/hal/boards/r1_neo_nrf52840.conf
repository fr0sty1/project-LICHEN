# R1 Neo HAL test config - validates identity and capability flags.
# board_name set to 'r1_neo' per project-LICHEN-worker6-yqy6.2.10.

CONFIG_LICHEN_BOARD_NAME="r1_neo"

# Capabilities matching enabled DTS nodes on R1 Neo.
# See lichen/boards/muzi/r1_neo/r1_neo_nrf52840.dts for hardware definitions.

# LEDs: led0 (green_led), led1 (blue_led)
CONFIG_LICHEN_HAS_LEDS=y

# Buttons: sw0 (button0)
CONFIG_LICHEN_HAS_BUTTONS=y

# Battery: battery0 alias to voltage-divider vbatt
CONFIG_SENSOR=y
CONFIG_LICHEN_HAS_BATTERY=y

# LoRa is disabled in base DTS; not enabled for minimal HAL test.
# GNSS, PMIC, display, external flash not present/validated.
CONFIG_LICHEN_HAS_GNSS=n
CONFIG_LICHEN_HAS_PMIC=n
CONFIG_LICHEN_HAS_DISPLAY=n
CONFIG_LICHEN_HAS_EXTERNAL_FLASH=n

# BLE local-client transport: nRF52840 supports BLE natively.
# The R1 Neo exposes the local client interface over BLE NUS.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="LICHEN"
CONFIG_BT_MAX_CONN=1
CONFIG_LICHEN_HAS_BLE_LOCAL=y
CONFIG_LICHEN_HAS_SERIAL_LOCAL=n

# UI profile: tracker mode (LEDs + buttons)
CONFIG_LICHEN_UI_PROFILE_TRACKER=y
