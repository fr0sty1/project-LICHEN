CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LICHEN=y
CONFIG_LICHEN_RPL=y
# The routing-state suite exercises DAO logic only. Keep unrelated link
# coordination profiles disabled and satisfy RPL's native IPv6 dependencies.
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_LICHEN_CCP_TDMA=n
CONFIG_LICHEN_CHANNEL_AGILITY=n
CONFIG_LICHEN_ADAPTIVE_SF=n
CONFIG_LICHEN_RPL_MAX_ROUTES=7
CONFIG_LICHEN_RPL_MAX_PARENTS=4
CONFIG_LICHEN_RPL_MAX_ACTIVE_DAO_CANDIDATES=8

CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
