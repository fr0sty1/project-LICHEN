# Renode console config for Seeed T1000-E.
#
# Switch the console from the board-default USB CDC-ACM to UARTE0 so that
# boot and log output is observable during headless Renode validation.
# See renode_console.overlay for the matching devicetree changes.

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Disable RTT console (not used by T1000-E but set explicitly for clarity)
CONFIG_RTT_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n

# nRF USBD model (NRF52840_USBD.cs) simulates VBUS/READY/EVENTCAUSE/tasks/events/
# interrupts per production trace. Full LICHEN_NATIVE + USBD stack reaches main
# without polling stall. Console remains on UART0 (showAnalyzer); CDC is
# initialized but unused in sim.
CONFIG_LICHEN_NATIVE=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_UART_MCUMGR=y
