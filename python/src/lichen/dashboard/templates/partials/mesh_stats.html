<div id="mesh-stats-content" style="font-size:1.1em;line-height:1.8"
     hx-get="/partial/mesh-stats" hx-trigger="load, every 5s" hx-swap="outerHTML">
  <div><strong>Nodes:</strong> {{ active }}</div>
  <div><strong>PPS:</strong> {{ pps }}</div>
  <div><strong>Loss:</strong> {{ loss }}</div>
  <div><strong>Hops:</strong> {{ hops }}</div>
  <div><strong>GWs:</strong> -</div>
  <div style="margin-top:0.5rem;font-size:0.8em;color:#58a6ff">
    Live {% if is_simulator %}- simulator{% else %}- mock{% endif %}
  </div>
</div>
<div style="margin-top:1rem;height:120px;background:#161b22;border:1px solid #30363d;border-radius:4px;position:relative" id="mini-waterfall"></div>
