name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run ruff
        run: uv run --directory python ruff check
      - name: Run mypy
        run: uv run --directory python mypy -p lichen

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run pytest
        run: uv run --directory python pytest

  rust-fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  rust-clippy:
    needs: rust-fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --all-targets -- -D warnings

  rust-build-test:
    needs: rust-fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build
      - run: cargo test

  rust-all-features:
    needs: rust-fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build with all features (catches FFI/feature drift)
        run: cargo build --package lichen-node --all-features

  c-cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=syntaxError \
            --std=c11 \
            -I lichen/include \
            -I lichen/subsys/lichen \
            lichen/subsys/ lichen/lib/ lichen/drivers/

  c-clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Run clang-tidy on changed C files
        run: |
          find lichen/subsys lichen/lib lichen/drivers -name '*.c' | head -50 | \
            xargs -I{} clang-tidy {} \
              --config-file=lichen/.clang-tidy \
              -p /dev/null \
              -- -I lichen/include -I lichen/subsys/lichen -std=c11

  c-standalone-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build schnorr48 standalone test (catches header/impl drift)
        run: |
          cd lichen/tests/schnorr48
          mkdir -p build && cd build
          cmake .. && make
      - name: Run schnorr48 test
        run: ./lichen/tests/schnorr48/build/schnorr48_test
      - name: Build pubkey_to_iid standalone test (catches header/impl drift)
        run: |
          cd lichen/tests/pubkey_to_iid
          mkdir -p build && cd build
          cmake .. && ctest --output-on-failure
      - name: Run pubkey_to_iid test
        run: ./lichen/tests/pubkey_to_iid/build/pubkey_to_iid_test

  test-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Validate test vectors
        run: uv run --directory python python -m pytest python/test/vectors/
