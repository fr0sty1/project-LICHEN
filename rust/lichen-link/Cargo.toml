[package]
name = "lichen-link"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "LICHEN link layer: frame format, LLSec modes, and replay window."

[features]
default = []
std = []
alloc = []  # Enables alloc-dependent code; required by schnorr feature
schnorr = ["alloc", "dep:schnorr48", "dep:sha2"]
test-utils = [] # Explicitly test-only evidence constructors; never enable in production.
# Logging: enable one or neither, not both
defmt = ["dep:defmt", "lichen-core/defmt"]
log = ["dep:log", "lichen-core/log"]

[dependencies]
schnorr48 = { version = "0.1", default-features = false, optional = true }
lichen-core = { path = "../lichen-core" }
sha2 = { version = "0.11.0", default-features = false, optional = true, features = ["zeroize"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1", default-features = false, features = ["derive"] }

# Logging backends (optional, feature-gated)
defmt = { version = "0.3", optional = true }
log = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[test]]
name = "root_authorization_vectors"
required-features = ["schnorr"]
