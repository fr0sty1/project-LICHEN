[package]
name = "lichen-oscore"
description = "OSCORE (RFC 8613) implementation for LICHEN"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Core OSCORE implementation - re-exported with LICHEN-specific integration
oscore = { version = "0.1", default-features = false }

# Re-export heapless for public API types
heapless = "0.8"

# Logging backends (optional, feature-gated)
defmt = { version = "0.3", optional = true }
log = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
hex-literal = "0.4"
rand_core = { version = "0.6", default-features = false, features = ["getrandom", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
std = ["oscore/std"]
# EDHOC Suite 0 (RFC 9528) for establishing OSCORE contexts
# Uses X25519/Ed25519 to match link-layer Schnorr48
edhoc = ["oscore/edhoc"]
# Logging: enable one or neither, not both
defmt = ["dep:defmt", "oscore/defmt"]
log = ["dep:log", "oscore/log"]
